[project]
name = "neural-from-scratch"
version = "0.1.0"
description = "从零手写神经网络：NumPy 实现、数值验证、可视化与 MLX 进阶"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "jupyterlab>=3.0",
    "keras>=2.12",
    "torch>=2.0",
    "plotly>=5.14",
    "ipywidgets>=8.0",
    "tensorflow-macos>=2.16.2",
    "tensorflow-metal>=1.2.0",
    "mlx>=0.31.2",
]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
